name: Metrics

on:
  schedule: [{cron: "0 */6 * * *"}] # tiap 6 jam (lebih realistis)
  workflow_dispatch:
  push: {branches: ["main", "master"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: YoungMolly

          # 🎨 Tampilan utama
          template: classic
          config_timezone: Asia/Jakarta

          base: header, activity, community, repositories, metadata

          # 🧠 Achievements (badge style)
          plugin_achievements: yes
          plugin_achievements_threshold: B
          plugin_achievements_display: compact

          # 📊 Coding habits
          plugin_habits: yes
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts_type: classic

          # 📅 Contribution calendar (keren)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # 💻 Bahasa pemrograman
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_colors: github

          # ⭐ Stars repo
          plugin_stars: yes
          plugin_stars_limit: 4

          # 🌆 Skyline (ini bikin beda)
          plugin_skyline: yes
          plugin_skyline_year: current-year

          # 📈 Activity chart (visual graph)
          plugin_activity: yes
          plugin_activity_limit: 5

          # 🔥 Streak
          plugin_followup: yes

          # 🧾 Repos highlights
          plugin_repositories: yes
          plugin_repositories_featured: yes

          # ⚡ Random quote (biar hidup)
          plugin_notable: yes

          # 📅 Contribution heatmap (ini yang lo cari)
plugin_isocalendar: yes
plugin_isocalendar_duration: full-year

# 📈 Activity (commit, PR, issue)
plugin_activity: yes
plugin_activity_limit: 10
plugin_activity_days: 14
plugin_activity_filter: all

# 🔥 Coding habits (jam coding dll)
plugin_habits: yes
plugin_habits_days: 14
plugin_habits_facts: yes
plugin_habits_charts_type: classic

# 📊 Contribution stats lebih detail
plugin_followup: yes
plugin_followup_sections: repositories, user

# ⭐ Tambahan biar lebih visual
plugin_stars: yes
plugin_stars_limit: 4
