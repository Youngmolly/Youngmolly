name: Metrics - Minimal (PASTI MUNCUL)
on:
  workflow_dispatch:  # Manual trigger aja dulu buat test
  schedule:
    - cron: '0 0 * * *'  # Nanti kalo mau otomatis

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Token wajib
          token: ${{ secrets.METRICS_TOKEN }}
          
          # Identitas
          user: Youngmolly
          template: classic
          
          # Base = repository (biar ada data minimal)
          base: repositories
          base_indepth: yes
          base_repositories: 3  # Ambil 3 repo teratas
          
          # Plugin yang PASTI punya data (walau sedikit)
          plugin_languages: yes
          plugin_languages_limit: 4
          plugin_languages_sections: most-used
          
          # Output
          filename: metrics.minimal.svg
          committer_message: "Update minimal metrics"
