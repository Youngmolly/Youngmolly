# .github/workflows/metrics.yml
name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["master", "main"]
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Wajib biar muncul
          filename: github-metrics.svg
          committer_message: "chore: update metrics [skip actions]"
          template: classic

          # Base biar super lengkap
          base: header, activity, community, repositories
          base_indepth: yes
          repositories_affiliations: owner, collaborator

          # Bahasa pemrograman (pasti kelihatan)
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: programming, markup
          plugin_languages_recent_categories: programming
          plugin_languages_limit: 12
          plugin_languages_threshold: 0%

          # Achievement + activity (biar keliatan keren)
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_limit: 10

          plugin_activity: yes
          plugin_activity_limit: 6
          plugin_activity_days: 14
          plugin_activity_visibility: public

          plugin_activity_filter: issue, pr, release, fork, review, reflect

          # TRAFFIC — ini WAJIB buat pastiin tampil
          plugin_traffic: yes
          plugin_traffic_skipped: []
          plugin_traffic_limit: 4

          plugins_list:
            - traffic
            - languages
            - achievements
            - activity

          output_condition: commit
