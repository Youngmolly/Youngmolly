# Metadata
name: Youngmolly
description: Advanced Metrics GitHub profile README
author:
  name: lowlighter
  email: 11614554+lowlighter@users.noreply.github.com

# Konfigurasi dasar
svg:
  optimize: true
  # format: svg  # atau "png"
  width: 1000
  # cache: 300   # cache ttl dalam detik

# Layout dan tema
base:
  filename: metrics.svg
  metadata: true
  output: README.md  # opsional, jika ingin update readme
  repositories: 100
  repositories_affiliations: owner, organization, collaborator

# Konfigurasi template
template:
  name: "@lowlighter/metrics"
  version: 3.34
  # layout: "2column"  # atau "1column", "classic", "terminal", "stateline"
  layout:
    # Untuk layout 2 kolom
    base_blocks:
      - "repositories"
      - "activity"
    columns:
      - id: 0
        blocks:
          - "isocalendar"
          - "languages"
          - "introduction"
      - id: 1
        blocks:
          - "github-metrics"
          - "followup"
          - "achievements"
          - "notable"

# Plugin dan komponen (aktifkan yang diperlukan)
plugin:
  # Statistik dasar
  lines: yes
  traffic: yes
  coverage: yes
  # 30 day activity
  activity:
    limit: 5
    days: 14
    filter: issue, pr, release, fork, review, ref/create
    load: 300
    visibility: all
    timestamp: yes
    repositories: yes
    github_events: yes
  # Isocalendar (kebiasaan kontribusi)
  isocalendar:
    duration: full-year
    # duration: 52
    full_year: yes
    # quarters: yes
    # first_week: yes
    # hide_weekdays: no
  # Languages plugin
  languages:
    recently_used: yes
    recently_used_days: 14
    # detail: yes
    details: percentage
    # details: bytes
    limit: 8
    sections: most-used
    ignored:
      - html
      - css
      - jupyter notebook
    # Also show other stats
    indicators:
      - "lines"
      - "bytes"
    # graph: yes
    # throttle: 100
  # Notable contributions
  notable:
    # include: org/repo etc.
    # exclude:
    #  - lowlighter/metrics
    # contributions: yes
    # revisions: yes
    # milestones: yes
    # types: commit, pull request, issue, etc.
    throttle: 100
  # Followup (issues/pull requests)
  followup:
    sections: both  # repositories, user
    # user:
    #  - type: issue
    #  - type: pr
    # repositories: yes
    # labels: yes
    # milestones: yes
    throttle: 100
  # Achievements
  achievements:
    limit: 10
    # only: [achievement0, achievement1]
    # exclude: [achievement2]
    # display: compact
    # throttle: 100
    # secrets: yes (for private achievements)
    # ignored:
    #   - stargazer
    #   - sponsor
    #   - public
  # Repositories
  repositories:
    # pinned: yes
    # random: yes
    # random_limit: 2
    # setup: yes
    # forks: yes
    # archives: yes
    # topics: yes
    # stars: yes
    # licenses: yes
    # order: "-pushed" # berdasarkan update terbaru
    # limit: 4
    # infos:
    #   - "stars"
    #   - "forks"
    #   - "size"
    #   - "license"
    #   - "language"
    #   - "issues"
    #   - "pulls"
    #   - "lastcommit"
  # Sponsors (jika ada)
  sponsors:
    # size: small|medium|large
    # sections:
    #   - "sponsors"
    #   - "sponsor_links"
    # limit: 4
    # repositories: yes
  # Habit tracking
  habits:
    enabled: yes
    facts: yes
    chart: yes
    # from:
    #   - "commits"
    #   - "prs"
    #   - "issues"
    #   - "comments"
    #   - "reviews"
    #   - "repos"
    #   - "stars"
    #   - "followers"
  # Introduction
  introduction:
    title: "Hello, I'm [Your Name] 👋"
  # Wakatime (opsional, butuh API key)
  wakatime:
    sections: time, projects, projects-graphs, languages, editors, os
    # limit: 5
    # token: ${{ secrets.WAKATIME_TOKEN }}
    # yes: true (jika pakai token)
  # GitHub metrics tambahan
  github-metrics:
    # people: yes
    # people_limit: 14
    # avatar: yes
  # Community plugins
  # repository:
  #   # You can also use community extensions
  #   # ex: lowlighter/metrics/plugin/wakatime
  #   plugin:
  #     # Community plugin config

# Mistik (optional)
# mystical:
#   stackoverflow:
#     user: 1234567
#     limit: 3
#   # other mystical things

# Opsi debugging
# debug: yes
# verbose: yes
# strict: true

# Token (gunakan GitHub Secrets)
# token: ${{ secrets.METRICS_TOKEN }}  # Bisa juga pakai GITHUB_TOKEN
# committer_token: ${{ secrets.GITHUB_TOKEN }}

# Output & commit
# commit:
#   message: "chore: update metrics"
#   author: github-actions[bot]
#   branch: main
