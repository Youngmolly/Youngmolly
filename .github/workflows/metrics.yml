name: Metrics - Lengkap & Akurat
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Youngmolly
          template: classic
          
          # 🔥 INI KUNCINYA: Ambil data repo & aktivitas
          base: repositories, activity, metadata
          base_indepth: yes
          base_repositories: 10
          
          # Tampilkan bahasa pemrograman
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_sections: most-used
          
          # Tampilkan aktivitas terbaru
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          
          # Jangan dulu pakai plugin yang butuh interaksi orang lain
          # plugin_reactions: no
          # plugin_achievements: no
          
          filename: metrics.lengkap.svg
          committer_message: "Update lengkap metrics"
