name: Metrics
on:
  schedule:
    - cron: "0 */4 * * *"   # JALAN SETIAP 4 JAM (lebih sering)
  workflow_dispatch:        # Bisa manual kapan aja
  push:
    branches: ["master", "main"]
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          # FORCE refresh GitHub API
          committer_message: "force: update metrics [skip actions]"
          retries: 3
          retries_delay: 10
          # Plugin spesifik biar akurat
          plugin_languages: yes
          plugin_languages_analysis_timeout: 30
          plugin_languages_ignored: html, css, markdown
          plugin_achievements: yes
          plugin_activity: yes
          plugin_activity_days: 7     # Ambil 7 hari terakhir (lebih fresh)
          plugin_traffic: yes
