name: Metrics

on:
  schedule:
    - cron: '0 0 * * *'   # 00:00 UTC setiap hari
  workflow_dispatch:

permissions:
  contents: write   # wajib, kalau tidak commit balik ke repo akan gagal (403)

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.METRICS_TOKEN }}   # penting: tanpa ini, commit dibuat oleh github-actions[bot], bukan akun kamu
          user: Youngmolly
          template: classic
          filename: metrics.svg
          committer_message: "Update metrics"

          # Urutan section (menggantikan konsep "2 column layout")
          base: header, activity, community, repositories, metadata
          config_order: isocalendar, languages, introduction, github-metrics, followup, achievements, notable

          # Basic stats
          plugin_lines: yes
          plugin_traffic: yes
          plugin_coverage: yes

          # 14 hari terakhir activity
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: issue, pr, release, fork, review, ref/create
          plugin_activity_load: 300
          plugin_activity_visibility: all
          plugin_activity_timestamps: yes
          plugin_activity_repositories: yes

          # Isocalendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Languages
          plugin_languages: yes
          plugin_languages_recent_categories: yes
          plugin_languages_recent_days: 14
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_ignored: html, css, jupyter notebook
          plugin_languages_indepth: yes

          # Notable contributions
          plugin_notable: yes
          plugin_notable_throttle: 100

          # Followup (issues/PR)
          plugin_followup: yes
          plugin_followup_sections: user, repositories
          plugin_followup_throttle: 100

          # Achievements
          plugin_achievements: yes
          plugin_achievements_limit: 10
          plugin_achievements_display: detailed

          # Coding habits
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # Introduction
          plugin_introduction_title: "Hello, I'm Youngmolly 👋"

          # WakaTime (opsional, isi WAKATIME_TOKEN kalau mau dipakai)
          plugin_wakatime: yes
          plugin_wakatime_token: ${{ secrets.WAKATIME_TOKEN }}
          plugin_wakatime_sections: time, projects, projects-graphs, languages, editors, os
