name: Metrics - Achievements
on:
  schedule:
    - cron: '0 0 * * *'  # Jalan setiap hari jam 00:00 UTC
  workflow_dispatch:      # Bisa dijalankan manual

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Youngmolly
          template: classic
          base: ""  # Kosong biar cuma achievements yang tampil
          
          # Plugin achievements
          plugin_achievements: yes
          plugin_achievements_display: detailed  # Tampilan detail (ada deskripsi)
          
          # Output file
          filename: metrics.achievements.svg
          committer_message: "Update achievements metrics"
