name: Metrics - Achievements
on:
  schedule:
    - cron: '5 0 * * *'  # 00:05 UTC, digeser 5 menit biar tidak bentrok sama metrics.yml
  workflow_dispatch:      # Bisa dijalankan manual

permissions:
  contents: write   # wajib, kalau tidak commit balik ke repo akan gagal (403)

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.METRICS_TOKEN }}   # penting: tanpa ini, commit dibuat oleh github-actions[bot], bukan akun kamu
          user: Youngmolly
          template: classic
          base: ""  # Kosong biar cuma achievements yang tampil
          
          # Plugin achievements
          plugin_achievements: yes
          plugin_achievements_display: detailed  # Tampilan detail (ada deskripsi)
          
          # Output file
          filename: metrics.achievements.svg
          committer_message: "Update achievements metrics"
